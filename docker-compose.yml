services:
  postgres:
    image: postgres:16-alpine
    container_name: winch-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-winch}"
      POSTGRES_USER: "${DB_USERNAME:-winch}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-winch} -d ${DB_DATABASE:-winch}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
